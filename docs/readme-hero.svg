<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">HinglishID-Router</title>
  <desc id="description">A five-stage Romanized Hindi-English customer support analysis pipeline, with research evaluation highlights.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#17232d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbf69"/>
      <stop offset="1" stop-color="#ef8e3c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <circle cx="1130" cy="15" r="230" fill="#254356" opacity=".22"/>
  <circle cx="33" cy="505" r="190" fill="#a96937" opacity=".12"/>

  <rect x="56" y="48" width="64" height="64" rx="18" fill="url(#mark)"/>
  <text x="88" y="91" text-anchor="middle" fill="#17232d" font-family="Arial, sans-serif" font-size="32" font-weight="800">H</text>
  <text x="142" y="77" fill="#f5f1e9" font-family="Georgia, serif" font-size="36" font-weight="700">HinglishID-Router</text>
  <text x="143" y="106" fill="#b9c3cc" font-family="Arial, sans-serif" font-size="16">Language-aware support routing for Romanized Hindi–English</text>

  <rect x="839" y="55" width="305" height="38" rx="19" fill="#263542" stroke="#405363"/>
  <circle cx="861" cy="74" r="5" fill="#73cfb4"/>
  <text x="878" y="79" fill="#d8e0e6" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">RESEARCH PROTOTYPE · OFFLINE RESULTS</text>

  <path d="M56 147H1144" stroke="#334552" stroke-width="1"/>
  <text x="58" y="184" fill="#ffbf69" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">FROM CUSTOMER MESSAGE TO SUPPORT QUEUE</text>

  <g font-family="Arial, sans-serif">
    <rect x="56" y="210" width="204" height="142" rx="17" fill="#1c2934" stroke="#394b58"/>
    <circle cx="82" cy="240" r="14" fill="#563e2a"/>
    <text x="82" y="245" text-anchor="middle" fill="#ffbf69" font-size="12" font-weight="700">01</text>
    <text x="76" y="283" fill="#f5f1e9" font-size="18" font-weight="700">Preprocess</text>
    <text x="76" y="310" fill="#b9c3cc" font-size="13">Clean text · mask entities</text>
    <text x="76" y="330" fill="#8d9ca8" font-size="12">Keep useful message cues</text>

    <rect x="280" y="210" width="204" height="142" rx="17" fill="#1c2934" stroke="#394b58"/>
    <circle cx="306" cy="240" r="14" fill="#254742"/>
    <text x="306" y="245" text-anchor="middle" fill="#73cfb4" font-size="12" font-weight="700">02</text>
    <text x="300" y="283" fill="#f5f1e9" font-size="18" font-weight="700">Token LID</text>
    <text x="300" y="310" fill="#b9c3cc" font-size="13">HI · EN · OTHER</text>
    <text x="300" y="330" fill="#8d9ca8" font-size="12">Character n-grams + context</text>

    <rect x="504" y="210" width="204" height="142" rx="17" fill="#1c2934" stroke="#394b58"/>
    <circle cx="530" cy="240" r="14" fill="#493852"/>
    <text x="530" y="245" text-anchor="middle" fill="#d5a5e8" font-size="12" font-weight="700">03</text>
    <text x="524" y="283" fill="#f5f1e9" font-size="18" font-weight="700">Normalize</text>
    <text x="524" y="310" fill="#b9c3cc" font-size="13">Phonetic variants</text>
    <text x="524" y="330" fill="#8d9ca8" font-size="12">Protect intent-bearing words</text>

    <rect x="728" y="210" width="204" height="142" rx="17" fill="#1c2934" stroke="#394b58"/>
    <circle cx="754" cy="240" r="14" fill="#2d405b"/>
    <text x="754" y="245" text-anchor="middle" fill="#91baff" font-size="12" font-weight="700">04</text>
    <text x="748" y="283" fill="#f5f1e9" font-size="18" font-weight="700">Classify</text>
    <text x="748" y="310" fill="#b9c3cc" font-size="13">Six support intents</text>
    <text x="748" y="330" fill="#8d9ca8" font-size="12">Rank intent probabilities</text>

    <rect x="952" y="210" width="192" height="142" rx="17" fill="#1c2934" stroke="#394b58"/>
    <circle cx="978" cy="240" r="14" fill="#51432b"/>
    <text x="978" y="245" text-anchor="middle" fill="#ffd17a" font-size="12" font-weight="700">05</text>
    <text x="972" y="283" fill="#f5f1e9" font-size="18" font-weight="700">Triage</text>
    <text x="972" y="310" fill="#b9c3cc" font-size="13">Queue · CMI · review</text>
    <text x="972" y="330" fill="#8d9ca8" font-size="12">Escalate low confidence</text>
  </g>

  <g stroke="#71808a" stroke-width="2" fill="none">
    <path d="M264 281h10m-5-5 5 5-5 5"/>
    <path d="M488 281h10m-5-5 5 5-5 5"/>
    <path d="M712 281h10m-5-5 5 5-5 5"/>
    <path d="M936 281h10m-5-5 5 5-5 5"/>
  </g>

  <rect x="56" y="380" width="1088" height="88" rx="18" fill="#202b34" stroke="#3d4a54"/>
  <path d="M418 398v52M781 398v52" stroke="#3d4a54"/>
  <text x="82" y="423" fill="#ffbf69" font-family="Georgia, serif" font-size="27" font-weight="700">98.42%</text>
  <text x="82" y="447" fill="#b9c3cc" font-family="Arial, sans-serif" font-size="13">held-out LID accuracy</text>
  <text x="446" y="423" fill="#73cfb4" font-family="Georgia, serif" font-size="27" font-weight="700">+10.79 pp</text>
  <text x="446" y="447" fill="#b9c3cc" font-family="Arial, sans-serif" font-size="13">ambiguous-token accuracy gain</text>
  <text x="809" y="423" fill="#91baff" font-family="Georgia, serif" font-size="27" font-weight="700">360 / 15</text>
  <text x="809" y="447" fill="#b9c3cc" font-family="Arial, sans-serif" font-size="13">intent queries / locked folds</text>

  <text x="57" y="495" fill="#7f8e99" font-family="Arial, sans-serif" font-size="11">Offline research metrics · Results and limitations are documented below</text>
</svg>
